name: smelter-queue
description: |
  Use when: The user explicitly wants to queue a next intent without interrupting current work.
  Input: The next intent to remember.
  Output: Queue behavior guidance for the active Smelter hook runtime.

  Queue is a utility command, not a coding pipeline. In Claude Code sessions the active
  UserPromptSubmit and PreToolUse hooks own the actual queued redirect state.

mutates_checkout: false

nodes:
  - id: queue
    command: smelter-queue
    context: fresh

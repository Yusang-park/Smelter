name: smelter-infra
description: |
  Use when: Infrastructure, cloud resources, deployments, IaC, credentials-adjacent operations, or destructive-risk work.
  Input: Infra/change request.
  Output: Inventory, plan, reviewed execution evidence, verification, and human check.

nodes:
  - id: investigate
    prompt: |
      Use workflow-investigate for infrastructure inventory and risk discovery.

      Request:
      $ARGUMENTS

      Identify resources, credentials boundaries, destructive operations, rollback options, and required approvals.
      Read .archon/smelter/document/workflow.md and .archon/smelter/modes/workflow.yaml when needed.
    skills: [workflow-investigate]
    context: fresh

  - id: investigate-review
    depends_on: [investigate]
    prompt: |
      Use workflow-investigate-review to verify infra inventory and risks.
    skills: [workflow-investigate-review]
    context: fresh

  - id: infra-plan
    depends_on: [investigate-review]
    prompt: |
      Use workflow-infra-plan. Include exact commands, dry-run checks, blast radius, rollback path, and approval points.
    skills: [workflow-infra-plan]
    context: fresh

  - id: infra-plan-review
    depends_on: [infra-plan]
    prompt: |
      Use workflow-infra-plan-review to reject unsafe, unaudited, or unclear infra execution plans.
    skills: [workflow-infra-plan-review]
    context: fresh

  - id: infra-execute
    depends_on: [infra-plan-review]
    prompt: |
      Use workflow-infra-execute. Execute only approved actions, capture evidence, and preserve rollback data.
    skills: [workflow-infra-execute]
    context: fresh

  - id: verify
    depends_on: [infra-execute]
    prompt: |
      Use workflow-verify for post-change infra verification.
    skills: [workflow-verify]
    context: fresh

  - id: human-check
    depends_on: [verify]
    prompt: |
      Use workflow-human-check. Present infra evidence, residual risks, rollback status, and terminal choices.
    skills: [workflow-human-check]
    context: fresh

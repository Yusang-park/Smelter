name: smelter-implement
description: |
  Use when: Build or extend existing product behavior with Smelter's gated implementation flow.
  Input: Feature or enhancement request.
  Output: Implemented change with investigation, plan, tests, reviews, E2E, and human check evidence.

  This is the Archon-native wrapper for Smelter's implement mode. Smelter source assets are
  preserved under .archon/smelter/, and the workflow skills are project-local in .claude/skills/.

nodes:
  - id: investigate
    prompt: |
      Use the workflow-investigate skill for this implementation request.

      Task:
      $ARGUMENTS

      Read .archon/smelter/document/workflow.md and .archon/smelter/modes/workflow.yaml when you need the canonical Smelter contract.
      Produce investigation.md with concrete repo evidence before planning.
    skills: [workflow-investigate]
    context: fresh

  - id: investigate-review
    depends_on: [investigate]
    prompt: |
      Use workflow-investigate-review to review investigation.md for omissions and contradictions.
      If it fails, repair investigation evidence before continuing.
    skills: [workflow-investigate-review]
    context: fresh

  - id: implementation-plan
    depends_on: [investigate-review]
    prompt: |
      Use workflow-implementation-plan to create implementation-plan.md.
      Include exact files, responsibilities, TDD steps, commands, expected outcomes, and bite-sized task queue.
    skills: [workflow-implementation-plan]
    context: fresh

  - id: implementation-plan-review
    depends_on: [implementation-plan]
    prompt: |
      Use workflow-implementation-plan-review to verify implementation-plan.md.
      Do not continue until the plan is actionable, scoped, and evidence-backed.
    skills: [workflow-implementation-plan-review]
    context: fresh

  - id: write-test
    depends_on: [implementation-plan-review]
    prompt: |
      Use workflow-write-test to write executable RED specifications before implementation.
      Record failing test command and failure output. Only use documented Smelter exemptions for copy/style/i18n-only work.
    skills: [workflow-write-test]
    context: fresh

  - id: coding
    depends_on: [write-test]
    prompt: |
      Use workflow-coding to implement the smallest source change that turns RED tests GREEN.
      Keep scope limited to implementation-plan.md and run scoped validation.
    skills: [workflow-coding]
    context: fresh

  - id: agent-review
    depends_on: [coding]
    prompt: |
      Use workflow-agent-review for code and security review of the implemented change.
      Fix any findings through the producer chain before proceeding.
    skills: [workflow-agent-review]
    context: fresh

  - id: e2e
    depends_on: [agent-review]
    prompt: |
      Use workflow-e2e to verify user-visible, CLI, API, hook, or script behavior.
      Include screenshot/video/bounding-box evidence for UI layout or position requirements.
    skills: [workflow-e2e]
    context: fresh

  - id: e2e-review
    depends_on: [e2e]
    prompt: |
      Use workflow-e2e-review to review E2E evidence. Reject missing or weak evidence.
    skills: [workflow-e2e-review]
    context: fresh

  - id: team-code-review
    depends_on: [e2e-review]
    prompt: |
      Use workflow-team-code-review for final multi-perspective review.
      Surface unresolved risks and route fixes before human check.
    skills: [workflow-team-code-review]
    context: fresh

  - id: human-check
    depends_on: [team-code-review]
    prompt: |
      Use workflow-human-check. Present evidence, unresolved issues, and completion options.
      Do not create commits or PRs unless the user explicitly chooses that terminal action.
    skills: [workflow-human-check]
    context: fresh

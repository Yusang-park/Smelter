# Skill Registry — workflow-* agent team defaults per mode context.
#
# Each skill declares its team pattern (A/B/C/D) and default agents.
# Modes may override via `default_team_overrides` in modes.yaml, but
# keeping defaults here eliminates the per-mode duplication that
# plagued modes/*.json v2.x.
#
# Pattern legend:
#   A = single agent
#   B = multi-agent consensus (advocate + critic + arbitrator)
#   C = parallel workers + aggregator
#   D = lead agent + sub-agents (persona or specialist)

skills:
  workflow-brainstorm:
    teams:
      deep:
        pattern: D
        lead: planner
        sub_agents: [product-persona, engineer-persona, design-persona]
      light:
        pattern: A
        default_agent: planner

  workflow-brainstorm-review:
    team:
      pattern: B
      default_agent: critic

  workflow-investigate:
    team:
      pattern: C
      default_agent: explore-medium
      aggregator: architect

  workflow-investigate-review:
    team:
      pattern: A
      default_agent: explore-high

  workflow-tasker:
    teams:
      deep:
        pattern: D
        lead: architect
        sub_agents: [researcher, executor]
      light:
        pattern: D
        lead: architect
        sub_agents: [executor]

  workflow-tasker-review:
    team:
      pattern: B
      default_agents: [advocate, critic, arbitrator]

  workflow-write-test:
    team:
      pattern: C
      default_agent: executor
      aggregator: executor

  workflow-coding:
    teams:
      fix:
        pattern: A
        default_agent: executor
        watchdog_enabled: true
      implement:
        pattern: C
        default_agent: executor
        watchdog_enabled: true
        aggregator: architect
      simple:
        pattern: A
        default_agent: executor

  workflow-agent-review:
    team:
      pattern: B
      default_agents: [code-reviewer, security-reviewer]
      aggregator: arbitrator

  workflow-e2e:
    team:
      pattern: A
      default_agent: qa-tester

  workflow-e2e-review:
    team:
      pattern: A
      default_agent: code-reviewer

  workflow-team-code-review:
    team:
      pattern: B
      default_agents: [advocate, critic, arbitrator]
      aggregator: arbitrator

  workflow-verify:
    team:
      pattern: A
      default_agent: qa-tester

  workflow-human-check:
    team:
      pattern: A
      default_agent: null   # user-driven

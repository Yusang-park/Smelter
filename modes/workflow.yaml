# Smelter v0.51 — unified workflow configuration.
#
# Single source of truth for: skills, pipelines, modes, target-type routing,
# transition adoption, verification rounds, and command aliases.
# Consumers: scripts/lib/workflow-loader.mjs.
#
# Schema shape:
#   verification_rounds  — global defaults per review phase
#   skills.<name>        — team pattern + default agents, optional round override
#   pipelines.<name>     — ordered skill sequence
#   target_type_routing  — in /fix mode, pick pipeline by target_type + scope signals
#   transition_adoptions — file-verified stage reuse across mode transitions
#   modes.<name>         — thin composition (entry + pipeline + flags + team_hints)
#   command_aliases      — /slash → mode

schema_version: "0.51"

verification_rounds:
  rounds: 2             # global policy for every review skill and mode

# -----------------------------------------------------------------------------
# Skill registry — per-skill team patterns and agents (workflow-* only).
# -----------------------------------------------------------------------------
skills:
  workflow-brainstorm:
    teams:
      deep:
        pattern: D
        lead: planner
        sub_agents: [product-persona, engineer-persona, design-persona]
      light:
        pattern: A
        default_agent: planner

  workflow-brainstorm-review:
    team:
      pattern: B
      default_agent: critic

  workflow-investigate:
    team:
      pattern: C
      default_agent: explore-medium
      aggregator: architect

  workflow-investigate-review:
    team:
      pattern: A
      default_agent: explore-high

  workflow-implementation-plan:
    team:
      pattern: D
      lead: architect
      sub_agents: [executor, researcher]

  workflow-implementation-plan-review:
    team:
      pattern: B
      default_agents: [advocate, critic, arbitrator]
      aggregator: arbitrator

  workflow-infra-plan:
    team:
      pattern: C
      default_agent: architect
      aggregator: security-reviewer

  workflow-infra-plan-review:
    team:
      pattern: B
      default_agents: [security-reviewer, critic, arbitrator]
      aggregator: arbitrator

  workflow-infra-execute:
    team:
      pattern: A
      default_agent: executor

  workflow-tasker:
    teams:
      deep:
        pattern: D
        lead: architect
        sub_agents: [researcher, executor]
      light:
        pattern: D
        lead: architect
        sub_agents: [executor]

  workflow-tasker-review:
    team:
      pattern: B
      default_agents: [advocate, critic, arbitrator]

  workflow-write-test:
    team:
      pattern: C
      default_agent: executor
      aggregator: executor

  workflow-coding:
    teams:
      fix:
        pattern: A
        default_agent: executor
        watchdog_enabled: true
      implement:
        pattern: C
        default_agent: executor
        watchdog_enabled: true
        aggregator: architect
      simple:
        pattern: A
        default_agent: executor

  workflow-agent-review:
    team:
      pattern: B
      default_agents: [code-reviewer, security-reviewer]
      aggregator: arbitrator

  workflow-e2e:
    team:
      pattern: A
      default_agent: qa-tester

  workflow-e2e-review:
    team:
      pattern: A
      default_agent: code-reviewer

  workflow-team-code-review:
    team:
      pattern: B
      default_agents: [advocate, critic, arbitrator]
      aggregator: arbitrator

  workflow-verify:
    team:
      pattern: A
      default_agent: qa-tester

  workflow-human-check:
    team:
      pattern: A
      default_agent: null     # user-driven

# -----------------------------------------------------------------------------
# Pipelines — reusable skill sequences, ordered.
# -----------------------------------------------------------------------------
pipelines:
  # Full — all /implement work. Code-first implementation planning replaces
  # the old lightweight brainstorm so /brainstorm remains PM/product planning.
  full:
    - workflow-investigate
    - workflow-investigate-review
    - workflow-implementation-plan
    - workflow-implementation-plan-review
    - workflow-write-test
    - workflow-coding
    - workflow-agent-review
    - workflow-e2e
    - workflow-e2e-review
    - workflow-team-code-review
    - workflow-human-check

  # fix — default /fix pipeline (all bug_fix regardless of scope). v0.51 records
  # a compact task checklist before tests so fixes have explicit scope, omission,
  # verification, and team-runtime evidence without the old verbose tasker prose.
  fix:
    - workflow-investigate
    - workflow-investigate-review
    - workflow-tasker
    - workflow-tasker-review
    - workflow-write-test
    - workflow-coding
    - workflow-agent-review
    - workflow-e2e
    - workflow-e2e-review
    - workflow-human-check

  # fix_simple — text/design change. TDD exempt, but still records the compact
  # v0.51 checklist before coding so no fix path loses scope/review evidence.
  fix_simple:
    - workflow-investigate
    - workflow-tasker
    - workflow-tasker-review
    - workflow-coding
    - workflow-e2e
    - workflow-human-check

  # Planning-only — /brainstorm. Terminal, no code.
  planning_only:
    - workflow-investigate
    - workflow-investigate-review
    - workflow-brainstorm
    - workflow-brainstorm-review
    - workflow-tasker
    - workflow-tasker-review

  # Read-only — /explore. The executor skill remains workflow-investigate.
  explore_only:
    - workflow-investigate
    - workflow-investigate-review

  # Verify — /verify.
  verify_only:
    - workflow-verify
    - workflow-e2e
    - workflow-e2e-review
    - workflow-human-check

  # Infra — infrastructure operations and infrastructure-as-code changes.
  # Separate from /fix and /implement because destructive/shared resources need
  # inventory, risk/backup planning, explicit approval, and post-change evidence,
  # not product-code TDD.
  infra_ops:
    - workflow-investigate
    - workflow-investigate-review
    - workflow-infra-plan
    - workflow-infra-plan-review
    - workflow-infra-execute
    - workflow-verify
    - workflow-human-check

  # Dobby — /dobby. Free-form edits with ONLY workflow-human-check as the terminal
  # gate. No TDD / investigate / review / e2e pipeline. Used when the user wants
  # to unblock code edits without running the full workflow but still wants the
  # terminal human review before commit.
  dobby_only:
    - workflow-human-check

# -----------------------------------------------------------------------------
# Target-type routing — in /fix mode, select pipeline after workflow-investigate
# determines target_type + file_count + surface.
# -----------------------------------------------------------------------------
target_type_routing:
  # target_type → pipeline (simple string mapping; scope-based upgrades removed before v0.4).
  # /fix and /implement share this table; selectPipeline() applies mode-specific gating:
  #   - /fix + extend_existing → upgrade_required (route user to /implement)
  #   - /implement + extend_existing → full (target_type is planning context)
  #   - /implement without target_type → mode's declared pipeline (full)
  #
  # v0.4: fix_simple is pinned to exactly two surfaces — text edits (텍스트 수정) and
  # design edits (디자인 수정). Everything else routes elsewhere.
  text: fix_simple                  # 텍스트 수정: typo / copy / dialogue / i18n
  design: fix_simple                # 디자인 수정: CSS / style / typography
  bug_fix: fix                      # all scopes — /fix default, no upgrade gates
  extend_existing: full             # /implement keeps full code-based planning; /fix blocks with upgrade_required
  new_feature: upgrade_required     # /fix → escalate to /implement or /brainstorm
  refactor: upgrade_required        # /fix → escalate to /implement or /brainstorm
  migration: upgrade_required       # /fix → escalate to /brainstorm

# -----------------------------------------------------------------------------
# Transition adoption — file-verified stage reuse across mode transitions.
# Runtime executes these policies; agents cannot skip stages by prose.
# -----------------------------------------------------------------------------
transition_adoptions:
  - id: explore_discovery_to_write
    from_modes: [explore]
    to_modes: [fix, implement]
    stages: [workflow-investigate, workflow-investigate-review]
    copy_artifacts: true
    advance_to_next_uncompleted: true
    metadata: [target_type, surface, file_count]

# -----------------------------------------------------------------------------
# Mode definitions — thin composition.
# -----------------------------------------------------------------------------
modes:
  brainstorm:
    description: Ideation + planning. No code changes. Produces brainstorm.md + tasks.md.
    entry_skill: workflow-investigate
    entry_params: { workflow-investigate: { depth: deep } }
    pipeline: planning_only
    read_only: true
    default_exempt: { tdd: true, e2e: true }
    team_hints:
      workflow-investigate: deep
      workflow-brainstorm: deep
      workflow-tasker: deep
    terminal_actions: [mode_transition_to_implement]
    transitions:
      upgrade_to: [implement]
      downgrade_to: [fix]

  fix:
    description: Bug / regression repair. Pipeline selected by workflow-investigate based on target_type.
    entry_skill: workflow-investigate
    # Runtime pipeline selection via target_type_routing. Default pipeline used until
    # target_type is determined by workflow-investigate output.
    pipeline: fix                 # v0.4 default; fix_simple for text/design, upgrade_required for extend/new_feature/refactor/migration
    target_type_dispatch: true    # workflow-loader picks pipeline after investigate
    read_only: false
    default_exempt: { tdd: false, e2e: false }
    team_hints:
      workflow-coding: fix
      workflow-tasker: light
    # Surface fields (target_type, exempt, skip_brainstorm) are emitted by
    # `classifyMode` in `scripts/lib/subagent-classifier.mjs` (natural language)
    # and by `parseSlashArgs` in `scripts/lib/surface-extraction.mjs` (slash args).
    # YAML-declared `magic_keywords` are no longer used.
    transitions:
      upgrade_to: [implement, brainstorm]
      downgrade_to: []

  implement:
    description: Feature development. Code investigation plus implementation-plan tradeoff decision, then TDD implementation.
    entry_skill: workflow-investigate
    pipeline: full
    # v0.4: /implement no longer branches to extend_light. target_type remains
    # contextual metadata for planning, not a pipeline selector.
    target_type_dispatch: true
    read_only: false
    default_exempt: { tdd: false, e2e: false }
    team_hints:
      workflow-coding: implement
    # See fix mode comment re: surface fields. YAML magic_keywords are no longer used.
    transitions:
      upgrade_to: [brainstorm]
      downgrade_to: [fix]

  infra:
    description: Infrastructure changes, cloud teardown/provisioning, deployment resources, and IaC edits. Requires inventory, risk/backup plan, explicit approval, execution evidence, and verification.
    entry_skill: workflow-investigate
    pipeline: infra_ops
    read_only: false
    default_exempt: { tdd: true, e2e: false }
    transitions:
      upgrade_to: [brainstorm]
      downgrade_to: [explore]

  explore:
    description: Static read only. Exits via user-chosen mode transition.
    entry_skill: workflow-investigate
    pipeline: explore_only
    read_only: true
    default_exempt: { tdd: true, e2e: true }
    terminal_actions: [mode_transition_to_fix, mode_transition_to_brainstorm, mode_transition_to_implement, free_chat]
    transitions:
      upgrade_to: [fix, brainstorm, implement]
      downgrade_to: []

  verify:
    description: Non-modifying verification. Tests + static inspection + real-interface E2E.
    entry_skill: workflow-verify
    pipeline: verify_only
    read_only: true
    default_exempt: { tdd: true, e2e: false }
    transitions:
      upgrade_to: [fix, implement, brainstorm]
      downgrade_to: []

  dobby:
    description: Free-form code edits seeded directly at EXECUTE with no workflow pipeline. Only workflow-human-check runs as the terminal gate. Use when workflow overhead is undesired but human review before commit is still required.
    entry_skill: workflow-human-check
    pipeline: dobby_only
    read_only: false
    default_exempt: { tdd: true, e2e: true }
    transitions:
      upgrade_to: [fix, implement, brainstorm]
      downgrade_to: []

# -----------------------------------------------------------------------------
# Slash command aliases (v0.4 canonical set).
# -----------------------------------------------------------------------------
command_aliases:
  /brainstorm: brainstorm
  /fix:         fix
  /infra:      infra
  /implement:   implement
  /explore:     explore
  /verify:      verify
  /dobby:       dobby

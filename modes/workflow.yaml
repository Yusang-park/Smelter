# Smelter v3.1 — unified workflow configuration.
#
# Single source of truth for: skills, pipelines, modes, target-type routing,
# verification rounds, and command aliases. Consumers: scripts/lib/workflow-loader.mjs.
#
# Schema shape:
#   verification_rounds — global defaults per review phase
#   skills.<name>       — team pattern + default agents, optional round override
#   pipelines.<name>    — ordered skill sequence
#   target_type_routing — in /fix mode, pick pipeline by target_type + scope signals
#   modes.<name>        — thin composition (entry + pipeline + flags + team_hints)
#   command_aliases     — /slash → mode

schema_version: "3.1.0"

# v3.1 — Multi-Pass Verification rounds refined.
# Terminal gates (visual E2E + multi-agent consensus + human) keep 3 rounds.
# Mid-pipeline reviews drop to 2 rounds — omission + contradiction are the load-bearing
# passes; edge-case is the one most often false-positive on simple bug fixes.
#
# v3.2 — /fix mode override. Every review in /fix runs 1 round by default, since the
# fix scope is narrow and terminal e2e + human gates catch escapes. The sole exception
# is workflow-e2e-review (visual + edge-case preserved as 2 rounds). human-check is a
# user gate, not a round count — keep at 3 for symmetry.
verification_rounds:
  mid_pipeline: 2       # brainstorm-review, investigate-review, tasker-review, agent-review
  terminal: 3           # e2e-review, team-code-review, human-check
  mode_overrides:
    fix:
      default: 1                    # all reviews in /fix pipelines use 1 round
      workflow-e2e-review: 2        # exception: preserves visual + edge_case verification
      workflow-human-check: 3       # user gate unchanged

# -----------------------------------------------------------------------------
# Skill registry — per-skill team patterns and agents (workflow-* only).
# -----------------------------------------------------------------------------
skills:
  workflow-brainstorm:
    teams:
      deep:
        pattern: D
        lead: planner
        sub_agents: [product-persona, engineer-persona, design-persona]
      light:
        pattern: A
        default_agent: planner

  workflow-brainstorm-review:
    team:
      pattern: B
      default_agent: critic
    rounds: mid_pipeline

  workflow-investigate:
    team:
      pattern: C
      default_agent: explore-medium
      aggregator: architect

  workflow-investigate-review:
    team:
      pattern: A
      default_agent: explore-high
    rounds: mid_pipeline

  workflow-tasker:
    teams:
      deep:
        pattern: D
        lead: architect
        sub_agents: [researcher, executor]
      light:
        pattern: D
        lead: architect
        sub_agents: [executor]

  workflow-tasker-review:
    team:
      pattern: B
      default_agents: [advocate, critic, arbitrator]
    rounds: mid_pipeline

  workflow-write-test:
    team:
      pattern: C
      default_agent: executor
      aggregator: executor

  workflow-coding:
    teams:
      fix:
        pattern: A
        default_agent: executor
        watchdog_enabled: true
      implement:
        pattern: C
        default_agent: executor
        watchdog_enabled: true
        aggregator: architect
      simple:
        pattern: A
        default_agent: executor

  workflow-agent-review:
    team:
      pattern: B
      default_agents: [code-reviewer, security-reviewer]
      aggregator: arbitrator
    rounds: mid_pipeline

  workflow-e2e:
    team:
      pattern: A
      default_agent: qa-tester

  workflow-e2e-review:
    team:
      pattern: A
      default_agent: code-reviewer
    rounds: terminal

  workflow-team-code-review:
    team:
      pattern: B
      default_agents: [advocate, critic, arbitrator]
      aggregator: arbitrator
    rounds: terminal

  workflow-verify:
    team:
      pattern: A
      default_agent: qa-tester

  workflow-human-check:
    team:
      pattern: A
      default_agent: null     # user-driven
    rounds: terminal

# -----------------------------------------------------------------------------
# Pipelines — reusable skill sequences, ordered.
# -----------------------------------------------------------------------------
pipelines:
  # Full — new feature / refactor / migration. 13 skills.
  full:
    - workflow-brainstorm
    - workflow-brainstorm-review
    - workflow-investigate
    - workflow-investigate-review
    - workflow-tasker
    - workflow-tasker-review
    - workflow-write-test
    - workflow-coding
    - workflow-agent-review
    - workflow-e2e
    - workflow-e2e-review
    - workflow-team-code-review
    - workflow-human-check

  # fix — default /fix pipeline (all bug_fix regardless of scope). 8 skills —
  # investigate-review retained as a cheap sanity gate; tasker + tasker-review +
  # team-code-review dropped because /fix scope is narrow enough that scoped
  # agent-review + terminal e2e-review + human-check suffice. v3.2: /fix now has
  # only two pipelines (`fix` and `fix_simple`); the former `medium`/`light` split
  # is gone (complex bug_fix rides the same `fix` path; /implement handles
  # extensions via extend_light).
  fix:
    - workflow-investigate
    - workflow-investigate-review
    - workflow-write-test
    - workflow-coding
    - workflow-agent-review
    - workflow-e2e
    - workflow-e2e-review
    - workflow-human-check

  # extend_light — /implement branch for extend_existing. 9 skills — full pipeline
  # minus brainstorm + brainstorm-review (existing feature defines scope), minus
  # tasker-review (tasker is scoped enough for extensions), minus team-code-review
  # (Pattern B agent-review suffices at this scale).
  extend_light:
    - workflow-investigate
    - workflow-investigate-review
    - workflow-tasker
    - workflow-write-test
    - workflow-coding
    - workflow-agent-review
    - workflow-e2e
    - workflow-e2e-review
    - workflow-human-check

  # fix_simple — typo / dialogue / pure-copy change. 4 skills — TDD exempt, no
  # tasker, no review phases that verify logic (copy changes have no logic).
  # v3.2: renamed from `minimal` so /fix has only `fix` and `fix_simple`.
  fix_simple:
    - workflow-investigate
    - workflow-coding
    - workflow-e2e
    - workflow-human-check

  # Planning-only — /think. Terminal, no code.
  planning_only:
    - workflow-brainstorm
    - workflow-brainstorm-review
    - workflow-investigate
    - workflow-investigate-review
    - workflow-tasker
    - workflow-tasker-review

  # Read-only — /investigate.
  investigate_only:
    - workflow-investigate
    - workflow-investigate-review

  # Verify — /verify.
  verify_only:
    - workflow-verify
    - workflow-e2e
    - workflow-e2e-review
    - workflow-human-check

# -----------------------------------------------------------------------------
# Target-type routing — in /fix mode, select pipeline after workflow-investigate
# determines target_type + file_count + surface.
# -----------------------------------------------------------------------------
target_type_routing:
  # target_type → pipeline (simple string mapping; scope-based upgrades removed in v3.2).
  # /fix and /implement share this table; selectPipeline() applies mode-specific gating:
  #   - /fix + extend_existing → upgrade_required (route user to /implement)
  #   - /implement + extend_existing → extend_light (honors the routing entry)
  #   - /implement without target_type → mode's declared pipeline (full)
  #
  # v3.3: fix_simple is pinned to exactly two surfaces — text edits (텍스트 수정) and
  # design edits (디자인 수정). Everything else routes elsewhere.
  text: fix_simple                  # 텍스트 수정: typo / copy / dialogue / i18n
  design: fix_simple                # 디자인 수정: CSS / style / typography
  bug_fix: fix                      # all scopes — /fix default, no upgrade gates
  extend_existing: extend_light     # /implement branch; /fix blocks with upgrade_required
  new_feature: upgrade_required     # /fix → escalate to /implement or /think
  refactor: upgrade_required        # /fix → escalate to /implement or /think
  migration: upgrade_required       # /fix → escalate to /think

# -----------------------------------------------------------------------------
# Mode definitions — thin composition.
# -----------------------------------------------------------------------------
modes:
  think:
    description: Ideation + planning. No code changes. Produces brainstorm.md + tasks.md.
    entry_skill: workflow-brainstorm
    entry_params: { workflow-brainstorm: { depth: deep } }
    pipeline: planning_only
    read_only: true
    default_exempt: { tdd: true, e2e: true }
    team_hints:
      workflow-brainstorm: deep
      workflow-tasker: deep
    terminal_actions: [mode_transition_to_implement]
    transitions:
      upgrade_to: [implement]
      downgrade_to: [fix]

  fix:
    description: Bug / regression repair. Pipeline selected by workflow-investigate based on target_type.
    entry_skill: workflow-investigate
    # Runtime pipeline selection via target_type_routing. Default pipeline used until
    # target_type is determined by workflow-investigate output.
    pipeline: fix                 # v3.2 default; fix_simple for typo/dialogue, upgrade_required for extend/new_feature/refactor/migration
    target_type_dispatch: true    # v3.1: workflow-loader picks pipeline after investigate
    read_only: false
    default_exempt: { tdd: false, e2e: false }
    team_hints:
      workflow-coding: fix
      workflow-tasker: light
    # Surface fields (target_type, exempt, skip_brainstorm) are emitted by
    # `classifyMode` in `scripts/lib/subagent-classifier.mjs` (natural language)
    # and by `parseSlashArgs` in `scripts/lib/surface-extraction.mjs` (slash args).
    # YAML-declared `magic_keywords` removed in v3.2.
    transitions:
      upgrade_to: [implement, think]
      downgrade_to: []

  implement:
    description: Feature development. Lightweight brainstorm + full pipeline, or extend_light when the change is an extension of existing code.
    entry_skill: workflow-brainstorm
    entry_params: { workflow-brainstorm: { depth: light } }
    pipeline: full
    # v3.2: /implement also target-type dispatches, but only to honor extend_existing
    # → extend_light. Other target_types use the mode's declared `full` pipeline.
    target_type_dispatch: true
    read_only: false
    default_exempt: { tdd: false, e2e: false }
    team_hints:
      workflow-brainstorm: light
      workflow-tasker: light
      workflow-coding: implement
    # See fix mode comment re: surface fields. YAML magic_keywords removed in v3.2.
    transitions:
      upgrade_to: [think]
      downgrade_to: [fix]

  investigate:
    description: Static read only. Exits via user-chosen mode transition.
    entry_skill: workflow-investigate
    pipeline: investigate_only
    read_only: true
    default_exempt: { tdd: true, e2e: true }
    terminal_actions: [mode_transition_to_fix, mode_transition_to_think, mode_transition_to_implement, free_chat]
    transitions:
      upgrade_to: [fix, think, implement]
      downgrade_to: []

  verify:
    description: Non-modifying verification. Tests + static inspection + real-interface E2E.
    entry_skill: workflow-verify
    pipeline: verify_only
    read_only: true
    default_exempt: { tdd: true, e2e: false }
    transitions:
      upgrade_to: [fix, implement, think]
      downgrade_to: []

# -----------------------------------------------------------------------------
# Slash command aliases (v3 canonical set).
# -----------------------------------------------------------------------------
command_aliases:
  /think:       think
  /fix:         fix
  /implement:   implement
  /investigate: investigate
  /verify:      verify

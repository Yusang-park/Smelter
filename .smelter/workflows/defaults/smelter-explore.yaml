name: smelter-explore
description: |
  Use when: Read-only repository exploration, diff analysis, architecture mapping, or question answering.
  Input: Codebase question or investigation request.
  Output: Evidence-backed explanation and optional next workflow recommendation.
  This workflow must not edit source files.

mutates_checkout: false

nodes:
  - id: investigate
    prompt: |
      Use workflow-investigate in read-only explore mode.

      Question:
      $ARGUMENTS

      Prefer local evidence, cite files/commands, and avoid source edits.
      Read .smelter/smelter/document/workflow.md and .smelter/smelter/modes/workflow.yaml when needed.
    skills: [workflow-investigate]
    context: fresh

  - id: investigate-review
    depends_on: [investigate]
    prompt: |
      Use workflow-investigate-review to verify the read-only answer for omissions and contradictions.
      Finish with concise findings and recommended next mode only if useful.
    skills: [workflow-investigate-review]
    context: fresh
